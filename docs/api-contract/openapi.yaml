openapi: 3.1.0
info:
  title: Inventory Management System API
  description: |-
    Backend contract for the Inventory Management System frontend clients.

    Authentication: obtain a JWT via POST /auth/login or POST /auth/register,
    then send `Authorization: Bearer <accessToken>` on every protected call.
    Refresh tokens are exchanged at POST /auth/refresh.

    Real-time updates are delivered over STOMP over WebSocket at /api/ws
    (see docs/api-contract/asyncapi-ws.md) - they are not part of this
    OpenAPI document.
  version: 0.1.0
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Cart
  description: Shopping-cart endpoints scoped to the authenticated customer
- name: Inventory
  description: Inventory query and management endpoints
- name: Orders
  description: Order management endpoints
- name: Authentication
  description: "Registration, login, token refresh, and current-user endpoints"
- name: Audit
  description: Admin audit-history endpoints
paths:
  /api/inventory/products/{id}:
    put:
      tags:
      - Inventory
      summary: Update product entry
      description: Updates product details and quantity.
      operationId: updateProduct
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
        required: true
      responses:
        "200":
          description: Product updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
  /inventory/products/{id}:
    put:
      tags:
      - Inventory
      summary: Update product entry
      description: Updates product details and quantity.
      operationId: updateProduct_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
        required: true
      responses:
        "200":
          description: Product updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
  /cart/{itemId}:
    put:
      tags:
      - Cart
      summary: Update a cart item
      description: Updates quantity (and optionally product) of one of the authenticated
        user's cart items.
      operationId: updateCartItem
      parameters:
      - name: itemId
        in: path
        description: Cart item identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
        required: true
      responses:
        "200":
          description: Cart item updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CartResponse"
        "400":
          description: Validation failed or quantity < 1
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CartResponse"
        "404":
          description: Cart item not found for this user
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CartResponse"
    delete:
      tags:
      - Cart
      summary: Remove a cart item
      description: Deletes one of the authenticated user's cart items.
      operationId: deleteCartItem
      parameters:
      - name: itemId
        in: path
        description: Cart item identifier
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Cart item removed
        "404":
          description: Cart item not found for this user
  /api/cart/{itemId}:
    put:
      tags:
      - Cart
      summary: Update a cart item
      description: Updates quantity (and optionally product) of one of the authenticated
        user's cart items.
      operationId: updateCartItem_1
      parameters:
      - name: itemId
        in: path
        description: Cart item identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
