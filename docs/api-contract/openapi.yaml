  /auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new customer account
      description: Creates an account with ROLE_CUSTOMER and returns tokens immediately.
        Passwords must be at least 8 characters and contain a letter and a digit.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: Account created; returns username plus access/refresh tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: "Validation failed (blank fields, bad email, weak password)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username or email already registered
          content:
            '*/*':
              schema:
                type: object
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Exchange a refresh token for a new token pair
      description: Validates the refresh JWT and issues a new access/refresh token
        pair for its subject.
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: New tokens issued
          content:
            '*/*':
              schema:
                type: object
        "401":
          description: Invalid or expired refresh token
          content:
            '*/*':
              schema:
                type: object
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Login with username and password
      description: "Returns JWT access + refresh tokens. Rate limited per username:\
        \ after security.login.max-attempts failures within the window, requests return\
        \ 429 until it expires."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Authenticated; returns AuthResponse
          content:
            '*/*':
              schema:
                type: object
        "401":
          description: Invalid username or password
          content:
            '*/*':
              schema:
                type: object
        "429":
          description: Too many failed attempts; account temporarily locked
          content:
            '*/*':
              schema:
                type: object
  /api/orders/{id}/ship:
    post:
      tags:
      - Orders
      summary: Ship a paid order
