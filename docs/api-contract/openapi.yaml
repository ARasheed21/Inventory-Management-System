components:
  schemas:
    UpdateProductRequest:
      type: object
      description: Payload used to update an existing product entry
      properties:
        name:
          type: string
          description: Product name
          example: Desk Lamp
          minLength: 1
        description:
          type: string
          description: Product description
          example: Compact desk lamp
        price:
          type: string
          description: Product price
          example: 45.0
          minLength: 1
        currency:
          type: string
          description: Currency code
          example: USD
          minLength: 1
        quantityInStock:
          type: integer
          format: int32
          description: Inventory quantity on hand
          example: 25
          minimum: 0
        category:
          type: string
          description: Product category
          example: lighting
      required:
      - currency
      - name
      - price
      - quantityInStock
    ProductResponse:
      type: object
      description: Product payload returned by the REST API
      properties:
        id:
          type: string
          description: Product identifier
          example: SKU-001
        name:
          type: string
          description: Product name
          example: Desk Lamp
        description:
          type: string
          description: Product description
          example: Compact desk lamp
        price:
          type: string
          description: Unit price
          example: 45.0
        currency:
          type: string
          description: Currency code
          example: USD
        quantityInStock:
          type: integer
          format: int32
          description: Inventory quantity on hand
          example: 25
        category:
          type: string
          description: Product category
          example: lighting
    UpdateCartItemRequest:
      type: object
      description: Payload used to update a cart item. productId is optional; when
        omitted the item keeps its current product.
      properties:
        productId:
          type: string
          description: New product id (optional - omit to only change quantity)
          example: product-1
        quantity:
          type: integer
          format: int32
          description: Quantity of the product in the cart
          example: 2
          minimum: 1
    CartResponse:
      type: object
      description: Cart item returned to the client
      properties:
        id:
          type: string
        customerId:
          type: string
        productId:
          type: string
        quantity:
          type: integer
          format: int32
    RegisterRequest:
      type: object
      description: Payload for POST /auth/register. Creates an account with ROLE_CUSTOMER.
      properties:
        username:
          type: string
          description: Unique username; becomes the order customerId for this user
          example: alice
          minLength: 1
        email:
          type: string
          format: email
          description: Unique email address
          example: alice@example.com
          minLength: 1
        password:
          type: string
          description: "Password: minimum 8 characters, must contain at least one\
            \ letter and one digit"
          example: s3cret-pass
          maxLength: 2147483647
          minLength: 8
      required:
      - email
      - password
      - username
    RegisterResponse:
      type: object
      description: Returned after successful registration; the account is created
        and tokens are issued immediately
      properties:
        username:
          type: string
          description: Username of the created account
          example: alice
        accessToken:
          type: string
          description: "JWT access token for Authorization: Bearer headers"
        refreshToken:
          type: string
          description: JWT refresh token for POST /auth/refresh
        expiresIn:
          type: integer
          format: int64
          description: Access token lifetime in seconds
          example: 900
    ApiError:
      type: object
      description: Standard error body returned by every non-2xx response
      properties:
        timestamp:
          type: string
          description: ISO-8601 timestamp of when the error occurred
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 404
        error:
          type: string
          description: Short error category
          example: Not found
        message:
          type: string
          description: Human-readable detail message
        path:
          type: string
          description: Request path that produced the error
          example: /api/orders/unknown
    RefreshRequest:
      type: object
      description: Body for POST /auth/refresh
      properties:
        refreshToken:
          type: string
          description: Refresh token previously returned by login/register
          minLength: 1
      required:
      - refreshToken
    LoginRequest:
      type: object
      description: Credentials for POST /auth/login
      properties:
        username:
          type: string
          description: Username of the account
          example: customer
          minLength: 1
        password:
          type: string
          description: Account password
          example: customer
          minLength: 1
      required:
      - password
      - username
    OrderResponse:
      type: object
      description: Order payload returned by the REST API
      properties:
        id:
          type: string
          description: Order identifier
          example: ord-123
        customerId:
          type: string
          description: Customer identifier
          example: customer-001
        status:
          type: string
          description: Order lifecycle status
          example: PENDING
        totalAmount:
          type: number
          description: Order total amount
          example: 25.0
        currency:
          type: string
          description: Currency code
          example: USD
        createdAt:
          type: string
          format: date-time
          description: Order creation timestamp
        reservedUntil:
          type: string
          format: date-time
          description: Reservation expiry timestamp
        reservationSecondsRemaining:
          type: integer
          format: int64
          description: Server-computed seconds left before the reservation expires
            (0 when not pending)
    CreateOrderItemRequest:
      type: object
      description: Order item payload for a product reservation
      properties:
        productId:
          type: string
          description: Identifier of the product to reserve
          example: SKU-001
          minLength: 1
        quantity:
          type: integer
          format: int32
          description: Requested item quantity
          example: 2
          minimum: 1
      required:
      - productId
    CreateOrderRequest:
      type: object
      description: Payload used to create a new order
      properties:
        customerId:
          type: string
          description: Customer identifier
          example: customer-001
          minLength: 1
        items:
          type: array
          description: Order items to reserve
          items:
            $ref: "#/components/schemas/CreateOrderItemRequest"
          minItems: 1
      required:
      - customerId
      - items
    CreateProductRequest:
      type: object
      description: Payload used to create a new product entry
      properties:
        name:
          type: string
          description: Product name
          example: Desk Lamp
          minLength: 1
        description:
          type: string
          description: Product description
          example: Compact desk lamp
        price:
          type: string
          description: Product price
          example: 45.0
          minLength: 1
        currency:
          type: string
          description: Currency code
          example: USD
          minLength: 1
        quantityInStock:
          type: integer
          format: int32
          description: Inventory quantity on hand
          example: 25
          minimum: 0
        category:
          type: string
          description: Product category
          example: lighting
      required:
      - currency
      - name
      - price
      - quantityInStock
    CartItemRequest:
      type: object
      description: Payload used to create or update a cart item
      properties:
        productId:
          type: string
          description: Identifier of the product to add to the cart
          example: product-1
          minLength: 1
        quantity:
          type: integer
          format: int32
          description: Quantity of the product in the cart
          example: 2
          minimum: 1
      required:
      - productId
    ProductListResponse:
      type: object
      description: Paginated product catalog page
      properties:
        content:
          type: array
          description: Products on this page
          items:
            $ref: "#/components/schemas/ProductResponse"
        total:
          type: integer
          format: int64
          description: Total number of matching products
          example: 42
        page:
          type: integer
          format: int32
          description: Current page number (0-based)
          example: 0
        size:
          type: integer
          format: int32
          description: Page size
          example: 20
    ReservedInventoryItem:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
        quantityInStock:
          type: integer
          format: int32
        quantityReserved:
          type: integer
          format: int32
        quantityAvailable:
          type: integer
          format: int32
    InventoryResponse:
      type: object
      description: Inventory payload returned by the REST API
      properties:
        productId:
          type: string
          description: Product identifier
          example: SKU-001
        name:
          type: string
          description: Product name
          example: Widget
        quantityInStock:
          type: integer
          format: int32
          description: Current stock quantity
          example: 25
    AuditEntryResponse:
      type: object
      properties:
        revision:
          type: integer
          format: int64
        timestamp:
          type: integer
          format: int64
        author:
          type: string
        revisionType:
          type: string
        snapshot:
          type: object
          additionalProperties: {}
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
